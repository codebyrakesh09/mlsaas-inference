services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowdesk']
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
      - flowdesk_uploads:/code/uploads
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg2://flowdesk:flowdesk@db:5432/flowdesk
      SECRET_KEY: change-this-long-random-text
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  flowdesk_uploads: